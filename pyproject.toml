[project]
name = "sdlc"
version = "0.1.0"
description = "Autonomous Data SDLC: Jira-driven workflow orchestrator and analyst agent"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "boto3",
    "jinja2",
    "python-dotenv",
    "pyyaml",
    "requests",
    "typer",
]

[project.scripts]
sdlc = "sdlc.cli:app"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"
