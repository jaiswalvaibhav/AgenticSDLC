[project]
name = "sdlc"
version = "0.1.0"
description = "Autonomous Data SDLC: Jira-driven workflow orchestrator and analyst agent"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4",
    "bedrock-agentcore",  # the AgentCore Runtime entrypoint wrapper; see agents/agentcore_app.py
    "boto3",
    "botocore[crt]>=1.43.108",
    "jinja2",
    "openpyxl>=3.1.5",
    "pydantic",
    "python-docx>=1.2.0",
    "python-dotenv",
    "pyyaml",
    "requests",
    "strands-agents[anthropic,gemini]",  # local-only non-Bedrock LLM stopgaps, see CLAUDE.md
    "typer",
    "weasyprint",  # needs system Pango/Cairo/GDK-Pixbuf; see src/sdlc/pdf.py
]

[project.scripts]
sdlc = "sdlc.cli:app"

[dependency-groups]
# graphviz needs the system `dot` binary too (brew install graphviz / apt install
# graphviz) — dev/demo-seed only, never imported by the aws-profile runtime path.
# bedrock-agentcore-starter-toolkit is the `agentcore` deploy CLI (dev machine only,
# not needed inside the container it builds — see src/sdlc/aws/agent_deploy.py).
dev = [
    "pytest",
    "graphviz",
    "bedrock-agentcore-starter-toolkit",
    "pillow>=12.3.0",
    "httpx",  # FastAPI's TestClient
    {include-group = "ui"},
]
# The workflow UI's backend (backend/sdlc_api) — local use only, never needed by the Lambda
# or the AgentCore image. Run with `uv run --group ui ...` (see Makefile `api`).
ui = ["fastapi", "uvicorn", "python-multipart"]  # multipart: mock Jira attachment uploads

[tool.pytest.ini_options]
pythonpath = ["backend"]

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"
