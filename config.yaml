profile: local
use_case: demo_order_fulfilment
state_dir: .state
data_dir: .data
atlassian:
  base_url: https://your-domain.atlassian.net
  email: ""
  api_token: ""
confluence:
  space_key: SPACE_KEY
jira:
  mode: mock   # mock = tickets in our own state, shown at /jira in the UI; real = Jira Cloud (needs atlassian.* and project_key)
  project_key: PROJECT_KEY   # real mode only
  mock:
    project_key: SDLC   # ticket keys read SDLC-1, SDLC-2, …
    project_name: SDLC Delivery
    issue_types: [Epic, Story, Task, Bug, Subtask]
    statuses: [To Do, In Progress, Done]   # board columns, in order
  components:
    engineer: Engineering
    tester: Testing
  assignees:
    analyst: ''
    engineer: ''
    tester: ''
  poll_interval_seconds: 300
  approval_label: sdlc-approved
  reject_label: sdlc-rejected
ui:
  poll_interval_seconds: 30   # the workflow UI's poller; faster than jira.poll_interval_seconds so progress feels live
analyst:
  auto_confirm_external_llm: true   # skip the billed-call confirmation for the local Anthropic/Gemini stopgap (CLI and UI); set false to confirm per call / per trigger
  max_anchor_chars: 400000   # ~100k tokens; anchors above this block with a comment, never truncated
  max_pdf_bytes: 4500000
  max_model_calls: 6   # caps the agent loop: a schema-validation error is fed back to the model, so without a cap a field it keeps getting wrong loops forever
  timeout_seconds: 900   # cancels a plan run that takes longer than this
  use_knowledge_base: true   # false = run the analyst from the DDS/TDS alone, no Knowledge Base calls (also off automatically when aws.knowledge_base_id is empty)
orchestrator:
  auto_start_manual_steps: true
  reopen_parent_on_child_reopen: true
aws:
  region: ap-southeast-2
  bucket: agentic-sdlc-state
  docs_prefix: confluence/
  jira_docs_prefix: jira/
  state_prefix: state/
  stack_prefix: sdlc
  knowledge_base_id: 1IMYCIP6SW
  data_source_id: KVKVRRWGEK
  jira_knowledge_base_id: ''
  jira_data_source_id: ''
  kb_role_arn: arn:aws:iam::489675988515:role/sdlc-storage-KBServiceRole-zkFW0P6wUqXs
  embedding_model_type: MANAGED
  embedding_model_arn: ''
  llm_model_id: apac.anthropic.claude-3-5-sonnet-20240620-v1:0
  agent_runtime_arn: ''
  tags:
    project: agentic-sdlc
